name: gam-go

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: greenalgeria
      POSTGRES_PASSWORD: greenalgeria
      POSTGRES_DB: greenalgeria
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U greenalgeria -d greenalgeria']
      interval: 3s
      timeout: 2s
      retries: 15

  api:
    build: .
    ports:
      - '8082:8082'
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: '8082'
      STORE_TYPE: postgres
      DATABASE_URL: postgresql://greenalgeria:greenalgeria@postgres:5432/greenalgeria
      AUTH_SECRET: local-dev-secret-change-me
      BETTER_AUTH_URL: http://localhost:8082
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      DISABLE_RATE_LIMIT: 'true'
      REQUIRE_EMAIL_VERIFICATION: 'false'
      MOCK_EMAIL: '1'

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8082
    ports:
      - '3000:80'
    depends_on:
      - api

volumes:
  pgdata:
