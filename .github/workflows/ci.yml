name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: go.sum
      - run: go mod tidy
      - run: go vet ./...

  test-unit:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: go.sum
      - run: go test -short -count=1 ./internal/...

  test-it:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: go.sum
      - run: go test -v -count=1 -timeout 600s ./internal/repository/... ./integration/...

  build:
    runs-on: ubuntu-slim
    needs: [check, test-unit, test-it]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: go.sum
      - run: go build -ldflags="-s -w" -o api ./cmd/api
      - uses: actions/upload-artifact@v4
        with:
          name: api
          path: api
